# Development Profile Configuration
# This profile uses H2 in-memory database for easy development and testing
# To use this profile, run: mvn spring-boot:run -Dspring-boot.run.profiles=dev

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:hospital_billing
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA/Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.app.hospitalbilling=DEBUG

# Initialize with sample data
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
